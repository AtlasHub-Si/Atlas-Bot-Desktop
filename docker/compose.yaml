# AtlasBot Self-Hosted — explicit Atlas image, account and Signal only.
# No inherited nightly-labs/openbot download, upstream image, credentials or ports.
# For the GWD pilot, use a separate Compose project, host data volume and network.
# Preflight: export ATLASBOT_HOST_IMAGE from a reviewed digest-pinned Atlas-built image.
# Example (not an automatically published image): ghcr.io/atlashub-si/atlasbot-host@sha256:<64-char-digest>
# Never run an unreviewed image or put OTP/claim/machineToken in this file.
name: atlasbot-self-hosted
services:
  atlasbot-host:
    image: ${ATLASBOT_HOST_IMAGE:?Set a reviewed, digest-pinned AtlasHub-Si Host image}
    restart: unless-stopped
    security_opt:
      - seccomp=./seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    environment:
      OPENBOT_AUTH_API_URL: ${ATLASBOT_AUTH_API_URL:?Set an Atlas-owned Account API HTTPS origin}
      OPENBOT_REMOTE_SIGNAL_URL: ${ATLASBOT_SIGNAL_URL:?Set an Atlas-owned Signal WSS URL}
      ATLASBOT_ENABLE_UPDATES: "0"
    volumes:
      - atlasbot-host-data:/data
    # No inbound published ports; all remote traffic connects out via Signal/TURN.
    # Do NOT use network_mode: host on a shared AtlasHub/GWD VPS.
volumes:
  atlasbot-host-data:
