name: AtlasBot checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlasbot-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run i18n:check
      - run: bun run typecheck:node
      - run: bun run typecheck:renderer
      - run: bun run typecheck:brand
      - run: bun run build
