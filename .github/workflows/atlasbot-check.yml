name: AtlasBot checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlasbot-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: node scripts/check-atlas-mit-license.mjs
      - run: node scripts/check-atlas-staging.mjs
      - run: node scripts/check-atlas-l0-identity.mjs
      - run: node scripts/check-atlas-release-sources.mjs
      - run: node scripts/check-atlas-public-surfaces.mjs
      - run: node scripts/check-atlas-rc1-public-links.mjs
      - run: node scripts/check-atlas-rc1-connected.mjs
      - run: bunx vitest run src/main/content-security-policy.test.ts src/main/atlas-telemetry-url.test.ts
      - run: bash -n scripts/install-server.sh
      - run: bun run i18n:check
      - run: bun run typecheck:node
      - run: bun run typecheck:renderer
      - run: bun run typecheck:brand
      - run: bun run build

  api-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: node scripts/check-atlas-mit-license.mjs
      - run: node scripts/check-atlas-staging.mjs
      - run: node scripts/check-atlas-rc1-public-links.mjs
      - run: node scripts/check-atlas-rc1-connected.mjs
      - run: bun run typecheck:api
      - name: Build isolated Atlas staging Worker
        working-directory: apps/auth-api
        env:
          CLOUDFLARE_ENV: atlas-staging
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
        run: bun run build
      - name: Test real local Worker account and device routes
        run: bun scripts/atlas-auth-worker-e2e.mjs
      - name: Upload account and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-auth-worker-e2e
          path: .openbot-build/atlas-auth-worker-e2e/report.json
          if-no-files-found: warn
          retention-days: 14
